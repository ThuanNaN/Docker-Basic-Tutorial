services:
  db:
    image: redis:7
    volumes:
      - dbdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  web:
    build: ../FastAPI-Tutorial
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]
    environment:
      - DATABASE_URL=sqlite:///./bookstore.db
      - SECRET_KEY=change-me-to-a-long-random-string
      - DEBUG=false
  db2:
    image: redis:7
    networks: [appnet]
volumes:
  dbdata:
networks:
  appnet:
